<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riddles-Random</title>
    <link rel="stylesheet" href="../../styles.css">
</head>
<body>
    <header>
        <section id="websiteExtra">
            <a href="riddlesDifficulty.html" class="plainLinks" id="backBtnLink"><button class="mainBackBtn">&lt;&lt;&lt;</button></a>
        </section>
        <section id="websiteTitle">
            <h1>Riddles</h1>
        </section>
        <nav id="websiteNav">
            <div id="websiteNavExtra"></div>
            <div class="menuWrapper">
                <div id="threeBars">
                    <div class="Bars"></div><div class="Bars"></div><div class="Bars"></div>
                </div>
                <div class="menuContent">
                    <a href="../../home.html">Home</a>
                    <a href="../../contactAbout.html">About/Contact</a>
                    <a href="../../guide.html">How to Play</a>
                </div>
            </div>
        </nav>
    </header>
    <section class="separator"></section>
    <div id="difficultyContainer"></div>
    <div id="randomOrLibrary"></div>
    <main class="gamesMainStart">
        <section class="gameArea">
            <div class="gameWrapper">
                <p id="informStatus" class="hidden">Already Solved</p>
                <div class="ownerDisplayStyle" id="itemCredit"></div>
                <span class="triesDisplayStyle" id="triesDisplay" ></span>
                <span class="statusInStartCard" id="statusInCard" ></span>
                <div class="questionContainer">
                    <p class="questionDisplayStyle" id="questionDisplay">Loading riddle...</p>
                    <div id="inputArea">
                        <input class="userGuessStyle" type="text" id="userGuess" placeholder="Type your guess here..." autocomplete="off">
                        <button class="submitGuessBtnStyle" id="submitGuessBtn">Submit</button>
                    </div>
                    <div id="lockoutArea" class="hidden">
                        <p class="replyStyle">Try again in: <span id="riddleTimer">23:59:59</span></p>
                    </div>
                    <p class="replyStyle" id="feedbackDisplay"></p>
                    <p class="replyStyle" id="answerDisplay" class="hidden"></p>
                </div>
                <div class="ingameChoices">
                    <div class="buttonGroup">
                        <button class="showAnswerBtnStyle" id="showAnswerBtn">Give Up?</button>
                        <button class="showAnswerBtnStyle" id="hintBtn">See hint?</button>
                        <button class="nextQuestionBtnStyle" id="nextQuestionBtn">Next Riddle&gt;&gt;</button>
                    </div>
                    <p class="hidden" id="hintBox"></p>
                </div>
            </div>
        </section>
        <section id="gamesExtra1">
            <div id="gameStats">
                <img src="../../images/All solved!.png" id="completionBadge" class="hidden">
                <div id="solvedDisplayLabel">
                    <div id="statsLabels">Solved: </div>
                    <img src="../../images/solved.png" class="statusIcon glow">
                </div>
                <div id="solvedDisplay"></div>
                <div id="giveupRecord"></div>
                <div id="hintRecord"></div>
            </div>
        </section>
        <section id="gamesExtra2"></section>
    </main>
    <dialog id="confirmDialog">
        <p id="dialogMessage">Are you sure?</p> 
        <div class="dialog-buttons">
            <button id="cancelBtn">Nah</button>
            <button id="confirmBtn">Yup</button>
        </div>
    </dialog>
    <script src="../SHARED FILES/common.js" defer></script>
    <script src="startScript.js" defer></script>
    <script src="../../menu.js"></script>
</body>
</html>
